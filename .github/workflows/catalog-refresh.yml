name: Refresh game recommendation catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: game-recommendation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refresh and persist catalog data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_TOP_GAME_LIMIT: ${{ vars.TWITCH_TOP_GAME_LIMIT || '100' }}
          TWITCH_STREAM_PAGE_LIMIT: ${{ vars.TWITCH_STREAM_PAGE_LIMIT || '5' }}
          IGDB_RECENT_DAYS: ${{ vars.IGDB_RECENT_DAYS || '60' }}
        run: |
          set +e
          npm run pipeline
          pipeline_status=$?
          validate_status=0
          if [ "$pipeline_status" -eq 0 ]; then
            npm run pipeline:validate
            validate_status=$?
          fi
          set -e

          oversized=$(find data/raw -type f -size +95M -print -quit)
          if [ -n "$oversized" ]; then
            echo "raw cache file exceeds the safe GitHub file-size limit: $oversized"
            exit 1
          fi

          git add data/history.json data/raw data/checkpoints src/playground/game-recommendation/catalog.json src/playground/game-recommendation/recommendations.json src/playground/game-recommendation/exploration
          if [ -d src/playground/game-recommendation/catalog/chunks ]; then
            git add src/playground/game-recommendation/catalog/chunks
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh game recommendation catalog"
            git push
          fi
          if [ "$pipeline_status" -ne 0 ]; then
            exit "$pipeline_status"
          fi
          exit "$validate_status"
