name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh game recommendation catalog
      - Backfill game recommendation catalog
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Set PATH_PREFIX
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Set SITE_URL
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "SITE_URL=https://$REPO_NAME" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          fi
      - name: Configure AdSense
        env:
          GOOGLE_ADS_CLIENT: ca-pub-8933203312924164
          GOOGLE_ADS_ENABLE_CONFIG: ${{ vars.GOOGLE_ADS_ENABLE }}
        run: |
          if [[ -z "$GOOGLE_ADS_CLIENT" ]]; then
            printf 'AdSense disabled: missing GOOGLE_ADS_CLIENT\n'
            printf 'GOOGLE_ADS_ENABLE=false\n' >> "$GITHUB_ENV"
          elif [[ "$GOOGLE_ADS_ENABLE_CONFIG" != "true" ]]; then
            printf 'AdSense disabled: GOOGLE_ADS_ENABLE is not true\n'
            printf 'GOOGLE_ADS_ENABLE=false\n' >> "$GITHUB_ENV"
          else
            printf 'GOOGLE_ADS_ENABLE=true\n' >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          GOOGLE_ADS_CLIENT: ca-pub-8933203312924164
          GOOGLE_ADS_SLOT_DEFAULT: ${{ vars.GOOGLE_ADS_SLOT_DEFAULT }}
          GOOGLE_ADS_SLOT_SIDEBAR_DISPLAY: ${{ vars.GOOGLE_ADS_SLOT_SIDEBAR_DISPLAY }}
          GOOGLE_ADS_SLOT_RAIL_DISPLAY: ${{ vars.GOOGLE_ADS_SLOT_RAIL_DISPLAY }}
          GOOGLE_ADS_SLOT_IN_ARTICLE: ${{ vars.GOOGLE_ADS_SLOT_IN_ARTICLE }}
          GOOGLE_ADS_SLOT_IN_FEED: ${{ vars.GOOGLE_ADS_SLOT_IN_FEED }}
          GOOGLE_ADS_IN_FEED_LAYOUT_KEY: ${{ vars.GOOGLE_ADS_IN_FEED_LAYOUT_KEY }}
          GOOGLE_ADS_SLOT_MULTIPLEX: ${{ vars.GOOGLE_ADS_SLOT_MULTIPLEX }}
          GOOGLE_ADS_PLAYGROUND_BOTTOM_SLOT: ${{ vars.GOOGLE_ADS_PLAYGROUND_BOTTOM_SLOT }}
        run: npm run build
      - name: Verify game recommendation artifact
        run: |
          test -f _site/playground/game-recommendation/catalog.json
          test -f _site/playground/game-recommendation/recommendations.json
          test -f _site/playground/game-recommendation/exploration/manifest.json
          node --input-type=module <<'EOF'
          import { accessSync, existsSync, readFileSync, readdirSync } from "node:fs";
          import { resolve } from "node:path";

          const artifactRoot = "_site/playground/game-recommendation";
          const catalogPath = `${artifactRoot}/catalog.json`;
          const recommendationsPath = `${artifactRoot}/recommendations.json`;
          const catalog = JSON.parse(readFileSync(catalogPath, "utf8"));
          const index = JSON.parse(readFileSync(recommendationsPath, "utf8"));

          if (index === null || typeof index !== "object" || Array.isArray(index) || index.recommendations === null || typeof index.recommendations !== "object" || Array.isArray(index.recommendations)) {
            throw new Error(`${recommendationsPath} is missing a recommendations object`);
          }

          // Keep the existing 116-game catalog deployable until the first live refresh
          // rewrites it to the manifest + chunks format.
          if (Array.isArray(catalog.games)) {
            console.log("legacy game recommendation catalog detected");
            process.exit(0);
          }
          if (!Array.isArray(catalog.chunks)) {
            throw new Error(`${catalogPath} is missing a chunks array`);
          }
          const gameIds = new Set();
          for (const chunkPath of catalog.chunks) {
            if (typeof chunkPath !== "string" || !/^\.\/catalog\/chunks\/\d{4}\.json$/.test(chunkPath)) {
              throw new Error(`invalid catalog chunk path: ${String(chunkPath)}`);
            }
            const chunkPathOnDisk = resolve(artifactRoot, chunkPath.slice(2));
            accessSync(chunkPathOnDisk);
            const chunk = JSON.parse(readFileSync(chunkPathOnDisk, "utf8"));
            if (!Array.isArray(chunk.games)) {
              throw new Error(`${chunkPathOnDisk} is missing games`);
            }
            for (const game of chunk.games) {
              if (game === null || typeof game !== "object" || typeof game.id !== "string") {
                throw new Error(`${chunkPathOnDisk} contains an invalid game`);
              }
              gameIds.add(game.id);
            }
          }

          if (index.generatedAt !== catalog.generatedAt) {
            throw new Error(`${recommendationsPath} generatedAt does not match catalog`);
          }
          if (index.gameCount !== catalog.gameCount) {
            throw new Error(`${recommendationsPath} gameCount does not match catalog`);
          }
          const expectedKeys = new Set(
            ["short", "medium", "long"].flatMap((length) =>
              [1, 2, 3, 4, 5].flatMap((players) =>
                [false, true].flatMap((viewerParticipation) =>
                  ["healing", "variety", "horror", "hardcore", "chatting", "spectacle"].map((vibe) =>
                    `${length}|${players}|${viewerParticipation ? 1 : 0}|${vibe}`,
                  ),
                ),
              ),
            ),
          );
          const recommendationKeys = Object.keys(index.recommendations);
          if (expectedKeys.size !== 180 || recommendationKeys.length !== expectedKeys.size || recommendationKeys.some((key) => !expectedKeys.has(key))) {
            throw new Error(`${recommendationsPath} has an unexpected recommendation key set`);
          }
          for (const recommendation of Object.values(index.recommendations)) {
            if (recommendation === null || typeof recommendation !== "object" || !Array.isArray(recommendation.picks)) {
              throw new Error(`${recommendationsPath} has an invalid recommendation`);
            }
            for (const pick of recommendation.picks) {
              if (pick === null || typeof pick !== "object" || pick.game === null || typeof pick.game !== "object" || typeof pick.game.id !== "string" || !gameIds.has(pick.game.id)) {
                throw new Error(`${recommendationsPath} recommendation picks reference game outside catalog`);
              }
            }
          }

          const explorationRoot = `${artifactRoot}/exploration`;
          const explorationPath = `${explorationRoot}/manifest.json`;
          const exploration = JSON.parse(readFileSync(explorationPath, "utf8"));
          const expectedQueries = [...expectedKeys];
          const expectedQueryDirectories = expectedQueries.map(encodeURIComponent).sort();
          const filteredViews = ["new", "rising", "discovery", "classic"];
          const pageSize = 24;
          const cardShardCount = 896;
          const invalid = (message) => { throw new Error(`exploration ${message}`); };
          const readJson = (path) => {
            try { return JSON.parse(readFileSync(path, "utf8")); }
            catch { invalid(`file is missing or malformed: ${path}`); }
          };
          const readBytes = (path) => {
            try { return readFileSync(path); }
            catch { invalid(`file is missing or malformed: ${path}`); }
          };
          const expectedBitsetBytes = Math.ceil(catalog.gameCount / 8);
          const expectedCardShard = (ordinal) => ordinal % cardShardCount;
          const countFiles = (path) => readdirSync(path, { withFileTypes: true }).reduce(
            (total, entry) => total + (entry.isDirectory() ? countFiles(`${path}/${entry.name}`) : entry.isFile() ? 1 : 0), 0,
          );

          if (exploration === null || typeof exploration !== "object" || Array.isArray(exploration)) invalid("manifest is invalid");
          if (exploration.format !== 1) invalid("manifest format is invalid");
          if (exploration.generatedAt !== catalog.generatedAt) invalid("manifest generatedAt does not match catalog");
          if (exploration.gameCount !== catalog.gameCount) invalid("manifest gameCount does not match catalog");
          if (exploration.pageSize !== pageSize) invalid("manifest pageSize is invalid");
          if (!Array.isArray(exploration.queries) || exploration.queries.length !== expectedQueries.length || exploration.queries.some((query, index) => query !== expectedQueries[index])) invalid("manifest has an unexpected query set");

          const cardDirectories = readdirSync(`${explorationRoot}/cards`).sort();
          const expectedCardFiles = Array.from({ length: cardShardCount }, (_, shard) => `${shard.toString().padStart(4, "0")}.json`);
          if (cardDirectories.length !== expectedCardFiles.length || cardDirectories.some((file, index) => file !== expectedCardFiles[index])) invalid("card shard files are incomplete");
          const cardsByOrdinal = new Map();
          const cardIds = new Set();
          for (let shard = 0; shard < cardShardCount; shard += 1) {
            const path = `${explorationRoot}/cards/${shard.toString().padStart(4, "0")}.json`;
            const shardCards = readJson(path);
            if (!Array.isArray(shardCards)) invalid(`card shard is invalid: ${path}`);
            for (const card of shardCards) {
              if (card === null || typeof card !== "object" || Array.isArray(card) || typeof card.id !== "string" || !gameIds.has(card.id) || !Number.isInteger(card.ordinal) || card.ordinal < 0 || card.ordinal >= catalog.gameCount) invalid(`card shard contains an invalid card: ${path}`);
              if (expectedCardShard(card.ordinal) !== shard || cardsByOrdinal.has(card.ordinal) || cardIds.has(card.id)) invalid(`card is duplicated or in the wrong shard: ${path}`);
              cardsByOrdinal.set(card.ordinal, card.id);
              cardIds.add(card.id);
            }
          }
          if (cardsByOrdinal.size !== gameIds.size || cardIds.size !== gameIds.size || [...gameIds].some((id) => !cardIds.has(id))) invalid("compact cards do not cover the catalog exactly once");

          const queryRoot = `${explorationRoot}/queries`;
          const queryDirectories = readdirSync(queryRoot, { withFileTypes: true }).filter((entry) => entry.isDirectory()).map((entry) => entry.name).sort();
          if (queryDirectories.length !== expectedQueryDirectories.length || queryDirectories.some((query, index) => query !== expectedQueryDirectories[index])) invalid("query roots are incomplete");
          for (const query of expectedQueries) {
            const queryPath = `${queryRoot}/${encodeURIComponent(query)}`;
            const manifest = readJson(`${queryPath}/manifest.json`);
            if (manifest === null || typeof manifest !== "object" || Array.isArray(manifest) || manifest.format !== 1 || manifest.generatedAt !== catalog.generatedAt || manifest.gameCount !== catalog.gameCount || manifest.pageSize !== pageSize) invalid(`query manifest metadata is invalid: ${query}`);
            const rankPath = `exploration/queries/${encodeURIComponent(query)}/rank.u32le`;
            if (manifest.rank === null || typeof manifest.rank !== "object" || manifest.rank.path !== rankPath || !Number.isInteger(manifest.rank.ordinalCount) || manifest.rank.ordinalCount < 0 || manifest.rank.byteLength !== manifest.rank.ordinalCount * 4) invalid(`rank descriptor is inconsistent: ${query}`);
            if (manifest.views === null || typeof manifest.views !== "object" || Array.isArray(manifest.views) || Object.keys(manifest.views).length !== filteredViews.length || filteredViews.some((view) => !(view in manifest.views))) invalid(`membership bitset descriptors are incomplete: ${query}`);
            const rank = readBytes(`${artifactRoot}/${manifest.rank.path}`);
            if (rank.byteLength !== manifest.rank.byteLength) invalid(`rank vector has an invalid byte length: ${query}`);
            const rankOrdinals = new Set();
            for (let offset = 0; offset < rank.byteLength; offset += 4) {
              const ordinal = rank.readUInt32LE(offset);
              if (ordinal >= catalog.gameCount || rankOrdinals.has(ordinal) || !cardsByOrdinal.has(ordinal)) invalid(`rank vector references an invalid ordinal: ${query}`);
              rankOrdinals.add(ordinal);
            }
            for (const view of filteredViews) {
              const descriptor = manifest.views[view];
              const path = `exploration/queries/${encodeURIComponent(query)}/${view}.bits`;
              if (descriptor === null || typeof descriptor !== "object" || descriptor.path !== path || !Number.isInteger(descriptor.count) || descriptor.count < 0 || descriptor.byteLength !== expectedBitsetBytes) invalid(`membership bitset descriptor is inconsistent: ${query}/${view}`);
              const bits = readBytes(`${artifactRoot}/${descriptor.path}`);
              if (bits.byteLength !== descriptor.byteLength) invalid(`membership bitset has an invalid byte length: ${query}/${view}`);
              if (catalog.gameCount % 8 && (bits[bits.length - 1] & ~((1 << (catalog.gameCount % 8)) - 1)) !== 0) invalid(`membership bitset has invalid padding: ${query}/${view}`);
              let count = 0;
              for (let ordinal = 0; ordinal < catalog.gameCount; ordinal += 1) {
                if ((bits[Math.floor(ordinal / 8)] & (1 << (ordinal % 8))) !== 0) {
                  if (!rankOrdinals.has(ordinal)) invalid(`membership bitset references an ordinal outside rank: ${query}/${view}`);
                  count += 1;
                }
              }
              if (count !== descriptor.count) invalid(`membership bitset count is inconsistent: ${query}/${view}`);
            }
          }
          const explorationFileCount = countFiles(explorationRoot);
          if (explorationFileCount > 2000) invalid(`has too many files: ${explorationFileCount}`);
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
